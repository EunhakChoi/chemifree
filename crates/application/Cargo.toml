[package]
name = "chemifree-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Compiled only for the conformance runner. It can inject a dataset that is explicitly
# identified as synthetic; production hosts still load their selected external registry.
conformance-fixtures = []

[dependencies]
chemifree-domain.workspace = true
chemifree-numerics.workspace = true
num-bigint = "0.5.1"
roxmltree = "0.21.1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true

[dev-dependencies]
# The operation contract tests run against the real file store; providers depends on this
# crate, which Cargo allows for tests.
chemifree-providers.workspace = true
tempfile.workspace = true

[lints]
workspace = true
