[workspace]
members = [
    "apps/api",
    "apps/cli",
    "crates/domain",
    "crates/inchi-native",
    "crates/numerics",
    "crates/application",
    "crates/providers",
    "crates/host",
    "crates/conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/EunhakChoi/chemifree"

[workspace.dependencies]
chemifree-domain = { path = "crates/domain" }
chemifree-inchi-native = { path = "crates/inchi-native" }
chemifree-numerics = { path = "crates/numerics" }
chemifree-application = { path = "crates/application" }
chemifree-providers = { path = "crates/providers" }
chemifree-host = { path = "crates/host" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
