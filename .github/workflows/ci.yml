name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: |
          chemifree_npm_prefix="$RUNNER_TEMP/chemifree-npm"
          npm install --global --prefix "$chemifree_npm_prefix" --ignore-scripts --no-audit --no-fund npm@11.13.0
          echo "$chemifree_npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Verify pinned npm
        run: |
          chemifree_npm_version="$(npm --version)"
          echo "npm $chemifree_npm_version"
          test "$chemifree_npm_version" = "11.13.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: npm ci
      - name: Check web, Rust, and HTTP/CLI contracts
        run: npm run check
