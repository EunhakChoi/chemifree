name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The full history/migration suite can reach the conformance step after 15 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: |
          chemifree_npm_prefix="$RUNNER_TEMP/chemifree-npm"
          npm install --global --prefix "$chemifree_npm_prefix" --ignore-scripts --no-audit --no-fund npm@11.13.0
          echo "$chemifree_npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Verify pinned npm
        run: |
          chemifree_npm_version="$(npm --version)"
          echo "npm $chemifree_npm_version"
          test "$chemifree_npm_version" = "11.13.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: npm ci
      - name: Check web, Rust, and HTTP/CLI contracts
        run: npm run check

  browser:
    # A fixed image: the browser's system libraries come from it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: |
          chemifree_npm_prefix="$RUNNER_TEMP/chemifree-npm"
          npm install --global --prefix "$chemifree_npm_prefix" --ignore-scripts --no-audit --no-fund npm@11.13.0
          echo "$chemifree_npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Verify pinned npm
        run: |
          chemifree_npm_version="$(npm --version)"
          echo "npm $chemifree_npm_version"
          test "$chemifree_npm_version" = "11.13.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - run: npm ci
      # The browser build is the one the locked playwright-core version names.
      - name: Install Chromium and its system libraries
        id: chromium
        run: npx playwright-core install --with-deps chromium
      - name: Manual stereo check across an unchanged render
        run: npm run test:browser:stereo-manual
      - name: Route-expiry guard (#8)
        run: npm run test:browser:routes
      - name: Native clipboard dialogs
        run: npm run test:browser:clipboard
      - name: MOL text clipboard bridge
        run: npm run test:browser:mol-clipboard
      - name: Scene graphics clipboard dialogs
        run: npm run test:browser:scene-clipboard
      - name: SMILES text clipboard bridge
        run: npm run test:browser:smiles-clipboard
      - name: CDXML explicit text clipboard copy
        run: npm run test:browser:cdxml-clipboard
      - name: CDXML explicit text clipboard import
        run: npm run test:browser:cdxml-import
      - name: Graphic forest native Cut
        run: npm run test:browser:scene-cut
      - name: Native clipboard across documents with the real backend
        run: npm run test:browser:clipboard-integration
      - name: Et display, hidden hit, whole-pair movement and native roundtrip
        run: npm run test:browser:abbreviation
      - name: Graphic creation tool, press-time context and page roots
        run: npm run test:browser:graphic-creation
      - name: Graphic endpoint form, retained scene structure and native roundtrip
        run: npm run test:browser:graphic-points
      - name: Retained fragment display, Unicode geometry and native roundtrip
        run: npm run test:browser:fragment-display
      - name: Custom display text and measured Unicode ink
        run: npm run test:browser:display-label
      - name: Chemical label weight, measured 700 ink and shared geometry
        run: npm run test:browser:label-weight
      - name: Chemical label italic SVG geometry and font loading
        run: npm run test:browser:label-style
      - name: Chemical label shadow
        run: npm run test:browser:label-shadow
      - name: Chemical label outline
        run: npm run test:browser:label-outline
      - name: Chemical label underline, actual run advances and shared bounds
        run: npm run test:browser:label-underline
      - name: Unicode caption form, canvas and native roundtrip
        run: npm run test:browser:caption
      - name: Independent ring insertion and uncertain outcome recovery
        run: npm run test:browser:ring
      - name: Attached carbon rings and ordinary stereo clearing
        run: npm run test:browser:attach-ring
      - name: User graph template files with the real backend
        run: npm run test:browser:user-template
      - name: Autosave process ownership and explicit restart reconciliation
        run: npm run test:browser:autosave-restart
      # Runs even if the guard check failed, so each check reports on its own.
      - name: Browser smoke
        id: smoke
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          CHEMIFREE_SMOKE_OUT: ${{ runner.temp }}/browser-smoke
          CHEMIFREE_SMOKE_NO_SKIPS: '1'
        run: npm run test:browser
      - name: Upload the smoke's records
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-smoke
          if-no-files-found: error
          retention-days: 14
